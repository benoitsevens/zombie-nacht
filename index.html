{n:5,name:'Grüne Platz',letter:'N',x:220,y:430,topic:'Binärzahlen',
 story:'Hauswart <b>Köbi</b> ist ratlos: Der Zombie-Computer steuert die Lichter auf dem Grüne Platz. Die acht Lampen zeigen eine Zahl in <b>Binär</b>, genau so, wie ein Micro:bit Zahlen speichert. Jede leuchtende Lampe zählt ihren Wert. Welche Zahl zeigen die Lampen?',
 answers:['73475cb40a568e8da8a045ced110137e159f890ac4da883b6b17dc651b3a8049'],
 hints:['Zähle nur die leuchtenden Lampen. Unter jeder steht ihr Wert.','Es leuchten die Lampen 32, 8 und 2. Zähle sie zusammen.','Rechne 32 + 8 + 2. Du kannst es mit dem Übungs-Rechner nachprüfen.'],
 merke:'Computer kennen nur 0 und 1 (aus / ein). Mit 8 Lampen (8 Bits = 1 Byte) kann man die Zahlen 0 bis 255 darstellen. Alles im Computer – Texte, Bilder, Musik, Spiele – ist am Ende nur eine riesige Reihe von Nullen und Einsen.',

{n:6,name:'Migros',letter:'S',x:430,y:430,topic:'Starke Passwörter',
 story:'Der Kassen-Computer von Kassiererin <b>Sandra</b> hatte das Passwort <span class="mono">kasse1</span>. Der Angreifer hat es in 0.2 Sekunden erraten. Erfindet ein neues Passwort, das ein Computer erst in <b>über 100 Jahren</b> knacken könnte. Das Messgerät zeigt euch, wie lange es dauern würde.',
 answers:[],
 hints:['Länger ist viel besser als komplizierter. Nimm mindestens 12 Zeichen.','Nimm 3 bis 4 Wörter, die zusammen einen Satz ergeben, den du dir merken kannst. Dazu eine Zahl und ein Zeichen.','Beispiel: <b>Kuerbis-tanzt-um-Mitternacht!7</b> (aber im echten Leben nimmst du dein eigenes!)'],

{n:7,name:'Tankstelle',letter:'C',x:560,y:300,topic:'Foto-Metadaten',
 story:'Tankstellen-Chef <b>Marco</b> hat auf dem Zombie-Computer eine Spur entdeckt: Der Angreifer hat auf «Dorfgram» ein Foto von seinem geheimen Treffpunkt gepostet. Den Hintergrund hat er abgeschnitten, damit niemand den Ort erkennt. Aber Fotos tragen unsichtbare Zusatz-Infos: <b>Metadaten</b>. Wo ist der Treffpunkt?',
 answers:['8b137fc52448278264c5bfde7f25ff04fcc9e638cca36d8b91d75fce7ff2ce8a','6d75c78c61dde621ead264a5642100ef45bf37b61963309175eee8cee6083b14','0328497500cab98dd1740e8598b50fec70fa865de370f158e1a61d4c4a630ada','4c54cae97a21981dedfeeadea27a367629e8836bd5c79723688833fd3a441f06'],
 hints:['Klick auf «Metadaten anzeigen».','Schau bei GPS und Ort.','Schau auf die Zeile «Ort (aus GPS)». Es ist der Badeplatz am See, gib nur das Wort ein, das die Fällander dafür benutzen.'],
 merke:'Fotos vom Handy enthalten oft Ort (GPS), Zeit und Gerät. Wer ein Foto postet, verrät vielleicht, wo er wohnt oder gerade ist. Viele Apps entfernen diese Daten beim Hochladen, aber nicht alle. Prüfe das, bevor du etwas teilst.',
 placeholder:'Ort', label:'Wo ist der Treffpunkt?'},
{n:8,name:'Fussballplatz',letter:'A',x:600,y:130,topic:'Zugriffskontrolle',
 story:'Der Zombie-Computer des Fussballclubs zeigt Spielerprofile, verwaltet von Präsident <b>Heinz</b>. Der Reinigungs-Code steht auf der privaten Seite des <b>Trainers</b>. Es gibt aber keinen Link dorthin. Schau dir die Adresse im Browser genau an. Was passiert, wenn du die Zahl änderst?',
 answers:['17d8dcc70be85d5d50586ee8a725d43acf06a7608feb3d579839dddf888cb43d'],
 hints:['Die Adresse endet mit <span class="mono">id=7</span>. Ändere die Zahl und drücke Enter.','Der Trainer hat die kleinste Nummer von allen.','Probier <span class="mono">id=1</span>. Der Code steht in der privaten Notiz des Trainers.'],
 merke:'Das nennt man «Broken Access Control»: Die Webseite prüft nicht, ob du eine Seite wirklich sehen darfst. Das ist einer der häufigsten Fehler im Internet. Wichtig: Auf echten Webseiten darf man so etwas nur mit Erlaubnis des Besitzers testen.',
 placeholder:'Code', label:'Reinigungs-Code'},
{n:9,name:'Altersheim',letter:'N',x:640,y:540,topic:'Kodierung vs. Verschlüsselung',
 story:'Heimleiterin <b>Margrit</b> hat es bemerkt: Der Zombie-Computer des Altersheims schickt dem Angreifer Nachrichten. Sie sehen verschlüsselt aus: <span class="mono">R0xPQ0tF</span>. Aber ist das wirklich Verschlüsselung? Oder nur eine andere Schreibweise (Kodierung), die jeder zurückrechnen kann?',
 answers:['6503a0d32d4d6bdd28e939131535c93bd1ef8a35f6d80e0296231b59ea956bf6'],
 hints:['Das ist <b>Base64</b>, eine Kodierung. Es gibt keinen Schlüssel, jeder kann sie zurückrechnen.','Tipp den Text in den Base64-Dekodierer.','Tipp genau <span class="mono">R0xPQ0tF</span> in den Dekodierer und klick auf «Dekodieren». Das Ergebnis ist die Lösung.'],
 merke:'Kodierung (z.B. Base64) ist nur eine andere Schreibweise, ohne Schlüssel. Verschlüsselung ist ohne den Schlüssel unlesbar. Angreifer tarnen ihre Daten oft nur mit Kodierung. Echte Profis lassen sich davon nicht täuschen.',

{n:10,name:'Badi',letter:'N',x:880,y:860,topic:'Social Engineering',

 merke:'Social Engineering heisst: Menschen austricksen statt Computer. Die Abwehr: Nie Passwörter weitergeben. Wenn jemand Druck macht, langsam werden. Immer auf dem bekannten Weg nachfragen (Lehrerin, Eltern, die echte Telefonnummer).',
 chat:true},
{n:11,name:'Restaurant Sternen',letter:'E',x:250,y:700,topic:'Hashes',
 story:'Der Zombie-Computer speichert Passwörter nicht im Klartext, sondern als <b>Fingerabdruck</b> (Hash). Einen Hash kann man nicht zurückrechnen. Aber man kann raten: Tipp berechnen, vergleichen. In einer Notiz steht: «Wirt <b>Sepp</b> vergisst sein Passwort ständig, darum nimmt er immer etwas aus dem Restaurant: Teller, Gabel, Rösti, Kuchen oder Suppe.»',
 answers:['4e91efd7d3748a5b4d3c8d56a061787175ea4819b7471af1a9a61a44c6176259'],
 hints:['Probier die Wörter aus der Notiz im Hash-Rechner, eines nach dem anderen.','Schreib die Wörter klein. Umlaute wie ö kannst du als ö oder oe schreiben, beides geht.','Man kann es essen.'],
 merke:'Gute Webseiten speichern nie dein Passwort, nur den Hash. Wird die Webseite gehackt, sehen die Angreifer nur Fingerabdrücke. Aber: Bei leicht zu ratenden Passwörtern hilft auch der beste Hash nichts. Übrigens sind alle Lösungen in diesem Spiel genau so gespeichert.',
 placeholder:'Passwort', label:'Admin-Passwort'},
{n:12,name:'Blitzstein',letter:'R',x:200,y:860,topic:'Endgegner',
 story:'Tief im Fällander Tobel, beim Blitzstein, steht der Computer, der alle Zombies steuert. Förster <b>Fredi</b> hat ihn gefunden. Zuerst müsst ihr im Logbuch herausfinden, von welcher <b>IP-Adresse</b> der Angreifer kam: Er hat um Mitternacht so lange Anmeldungen probiert, bis eine geklappt hat. Dafür gibt es den letzten Buchstaben. Dann geht es zurück ins Dorf: In der <b>Turnhalle</b> wartet die Cyber-Abwehr-Zentrale auf den Anti-Virus-Code.',

 hints:['Suche im Logbuch nach «FEHLER». Welche Adresse kommt immer wieder vor?','Die Adresse beginnt mit <span class="mono">10.0.0.</span>','Die IP ist die einzige, die sechsmal hintereinander FEHLER hat und danach OK. Der Code sind eure 12 Buchstaben in der Reihenfolge der Stationen 1 bis 12, sie ergeben ein deutsches Wort für ein Programm gegen Viren.'],
 merke:'Logbücher (Logs) sind die wichtigste Spur für Sicherheits-Teams. Jede Anmeldung, jeder Fehler wird aufgeschrieben. Viele fehlgeschlagene Versuche von einer Adresse heissen fast immer: Hier probiert jemand Passwörter durch.',

// ---------- state ----------
let S=load();
function defaultState(){return{started:false,team:'',done:0,gate:0,home:false,gatesOff:false,hintsShown:{},wrong:{},hintTime:{},view:'start',hintWait:300}}
function load(){try{const s=JSON.parse(localStorage.getItem('zn_state'));if(s&&typeof s.done==='number'){if(typeof s.team==='number')s.team=s.team>=0?(TEAMS[s.team]||''):'';return Object.assign(defaultState(),s)}}catch(e){}return defaultState()}
function save(){try{const o=Object.assign({},S);delete o.teacherOk;localStorage.setItem('zn_state',JSON.stringify(o))}catch(e){}}
function homeOn(){return S.home||S.gatesOff}
function saveCode(){const v=S.done;const c=sha256(v+'|zn-salt-2026').slice(0,4).toUpperCase();return 'ZN-'+String(v).padStart(2,'0')+'-'+c}
function parseCode(str){const m=String(str).trim().toUpperCase().match(/^ZN-?(\d{2})-?([0-9A-F]{4})$/);if(!m)return null;const v=parseInt(m[1],10);if(isNaN(v)||v>12)return null;if(sha256(v+'|zn-salt-2026').slice(0,4).toUpperCase()!==m[2])return null;return{done:v}}
function applyHash(){const h=(location.hash||'').slice(1).toLowerCase();if(!h)return;if(sha256(h)===CODES.home){S.home=true;save()}if(h==='lehrer'){S.view='teacher'}}

const app=document.getElementById('app');
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){animClear();app.innerHTML='';window.scrollTo(0,0);const v=S.view;
 if(v==='teacher')return renderTeacher();
 if(!S.started||!S.team)return renderStart();
 if(v==='level')return renderLevel(S.done+1);
 if(v==='boss')return renderBoss();
 if(v==='review')return renderLevel(Math.min(S.reviewLevel||1,Math.max(S.done,1)));
 if(v==='gate')return renderGate();
 if(v==='diploma')return renderDiploma();
 if(v==='win')return renderWin();
 renderMap()}

 const c=el(`<div class="stack"><div class="topbar"><p class="eyebrow">Diplom</p><button class="sec" id="back">Zur Karte</button></div>
 <div class="diploma"><div class="seal">🛡️</div><h2>Cyber-Abwehr Fällanden</h2><p class="eyebrow" style="color:#6b4a12">Diplom</p><p>Das Team</p><p class="big">${esc(S.team)}</p><p>hat in der Zombie-Nacht in Fällanden</p><p class="big">${S.done} von 12 Zombie-Computern gereinigt</p><p>${S.bossDone?'und den Virus von der Zentrale aus endgültig vernichtet.':'und darf sich jetzt offiziell Cyber-Abwehr-Rekrut nennen.'}</p><p class="small" style="color:#6b5a3a">${ds} · Begabtenförderung Informatik, Schule Fällanden</p>
 <hr style="border:0;border-top:1px solid #d9c9a4;width:60%"><p style="font-size:.95rem"><b>Zuhause weiterspielen:</b> Öffne den Spiel-Link und hänge am Ende das Geheimwort an:<br><span class="mono" style="font-size:1.1rem">#zombiejaeger</span><br>Dann sind alle Schleusen offen. Spielstand-Code: <span class="mono">${saveCode()}</span></p></div>
 <p class="small center">Tipp: Mach einen Screenshot vom Diplom.</p></div>`);app.appendChild(c);c.querySelector('#back').onclick=()=>{S.view='map';save();render()}}

// ---------- teacher ----------
function renderTeacher(){
 if(!S.teacherOk){const c=el(`<div class="stack"><h2>Lehrer-Panel</h2><div class="card"><div class="row"><input id="tc" type="password" placeholder="Lehrer-Code" autocomplete="off"><button id="tgo">Öffnen</button><button class="sec" id="tback">Zurück</button></div><div class="feedback bad" id="tfb"></div></div></div>`);app.appendChild(c);
  const go=()=>{if(sha256(norm(c.querySelector('#tc').value))===CODES.teacher){S.teacherOk=true;render()}else c.querySelector('#tfb').textContent='Falscher Code.'};c.querySelector('#tgo').onclick=go;c.querySelector('#tc').addEventListener('keydown',e=>{if(e.key==='Enter')go()});c.querySelector('#tback').onclick=()=>{S.view='map';try{history.replaceState(null,'',location.pathname)}catch(e){};render()};return}
 const c=el(`<div class="stack"><div class="topbar"><h2>Lehrer-Panel</h2><button class="sec" id="tback">Zum Spiel</button></div>
 <div class="card grid2">
  <div class="stack"><p class="eyebrow">Dieser Computer</p><p>Team: <b>${S.team?esc(S.team):'–'}</b></p><p>Gereinigt: <b>${S.done}</b> / 12 · Letzte Schleuse offen: <b>${S.gate}</b></p><p>Heim-Modus: <b>${S.home?'ja':'nein'}</b></p></div>
  <div class="stack"><label class="eyebrow" for="tt">Team setzen</label><input id="tt" maxlength="30" value="${esc(S.team)}" placeholder="Team-Name">
   <label class="eyebrow" for="tl">Nächste Station (springen)</label><select id="tl">${LEVELS.map(l=>`<option value="${l.n-1}" ${l.n-1===S.done?'selected':''}>Station ${l.n}: ${l.name}</option>`).join('')}<option value="12" ${S.done===12?'selected':''}>Alles fertig</option></select>
   <button id="tapply">Anwenden</button></div>
  <div class="stack"><label class="eyebrow" for="thw">Wartezeit zwischen Hinweisen</label><select id="thw">${[0,60,120,180,300,600].map(v=>`<option value="${v}" ${v===(S.hintWait??300)?'selected':''}>${v===0?'keine':v/60+' Minuten'}</option>`).join('')}</select><button class="sec" id="thwgo">Speichern</button></div>
  <div class="stack"><p class="eyebrow">Schleusen</p><p>Status: <b>${S.gatesOff?'alle offen':'aktiv (Code nötig)'}</b></p><button class="warn" id="tgates">${S.gatesOff?'Schleusen einschalten':'Alle Schleusen öffnen'}</button></div>
  <div class="stack"><p class="eyebrow">Zurücksetzen</p><p class="small">Löscht Team, Fortschritt und Hinweise auf diesem Computer.</p><button class="sec" id="treset">Spiel zurücksetzen</button></div>
 </div></div>`);app.appendChild(c);
 c.querySelector('#tback').onclick=()=>{S.view=S.started?'map':'start';try{history.replaceState(null,'',location.pathname)}catch(e){};save();render()};
 c.querySelector('#tapply').onclick=()=>{S.team=c.querySelector('#tt').value.trim().slice(0,30)||S.team||'Cyber-Abwehr';S.done=+c.querySelector('#tl').value;S.bossDone=S.done>=12;S.gate=Math.min(S.done,6);S.started=true;save();render()};
 c.querySelector('#thwgo').onclick=()=>{S.hintWait=+c.querySelector('#thw').value;save();render()};
 c.querySelector('#tgates').onclick=()=>{S.gatesOff=!S.gatesOff;save();render()};
 c.querySelector('#treset').onclick=()=>{const keep=S.gatesOff,hw=S.hintWait;S=defaultState();S.gatesOff=keep;S.hintWait=hw;S.teacherOk=true;S.view='teacher';save();render()};
}

// ---------- boot ----------
function start(data){if(data&&typeof data.done==='number')S=Object.assign(defaultState(),data);applyHash();if(S.view==='level'&&S.done>=12)S.view='map';render()}
window.addEventListener('hashchange',()=>{applyHash();render()});
try{window.claude?.hot?.snapshot?.(()=>S)}catch(e){}
(window.claude?.hot?.ready)?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>

</body>
</html>
